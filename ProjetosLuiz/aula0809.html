<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>aula</title>
    <style>
        .top {
            display: flex;    
            justify-content: space-between;
            align-items: center;
            padding: 16px 32px;
            gap: 16px;
            background-color: rgba(211, 211, 211, 0.318);
            flex-wrap: wrap;
        }
        .menu{
            display: flex;
            gap: 24px;
            list-style-type: none;
        
        }
        li:hover{
            color: red;
        }
        img{
            width: 100px;
            height: 70px;
        }
        #entrar{
            background-color: rgb(83, 187, 83);
            border-radius: 7px;
            padding: 10px;
            border-color: black;
        }
        .bla{
            display: flex;
            align-items: center;
        }
    </style>
</head>
<body>
    <main>
        <nav class="top">
            <img src="https://www.gstatic.com/marketing-cms/assets/images/08/25/fffdc76145f28be3a1ca63859c4a/external-logo-core-1.png=n-w1860-h1047-fcrop64=1,00000000ffffffff-rw" alt="foto aleatoria" >
            <ul class="menu">
                <li class="bla">inicio</li>
                <li class="bla">cursos</li>
                <li class="bla">sobre</li>
                <li id="entrar">entrar</li>
            </ul>
        </nav>
    </main>

    
</body>
</html>
