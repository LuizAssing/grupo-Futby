        * {

        body {
            margin: 0;

            background: #0f172a;
            color: #e2e8f0;
        }

        header {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            padding: 3rem 1.5rem 2rem;

        }

        section h2 {
            font-size: 1.3rem;

        }

        ul {
            list-style: none;
            margin: 0;
            padding: 0;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 0.9rem;
        }

        li a {
            display: block;
            background: #1e293b;
            color: #e2e8f0;
            text-decoration: none;
            padding: 1rem 1.2rem;
            border-radius: 10px;
            border: 1px solid #334155;
            transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
        }

        li a:hover {
            transform: translateY(-3px);
            border-color: #38bdf8;
            background: #253549;
        }

        footer {
            text-align: center;
            color: #64748b;
            padding: 1.5rem;
            font-size: 0.85rem;
        }
